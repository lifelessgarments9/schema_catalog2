services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: schema_catalog-backend:dev
    container_name: django_backend

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: "config.settings"

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: schema_catalog-frontend:dev
    container_name: react_frontend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "3000:3000"

    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8000

    depends_on:
      - backend

    restart: unless-stopped
