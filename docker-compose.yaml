services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: schema_catalog-backend:dev
    container_name: django_backend

    volumes:
      - ./backend:/app

    ports:
      - "127.0.0.1:8020:8000"

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: "config.settings"
      APP_URL_PREFIX: ${APP_URL_PREFIX:-}

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: schema_catalog-frontend:dev
    container_name: react_frontend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "127.0.0.1:3020:3000"

    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=${REACT_APP_API_URL:?Set REACT_APP_API_URL in .env to the public backend URL}
      - REACT_APP_BASE_PATH=${APP_URL_PREFIX:-}
      - PUBLIC_URL=${APP_URL_PREFIX:-}

    depends_on:
      - backend

    restart: unless-stopped
