services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: schema_catalog-backend:dev
    container_name: django_backend

    volumes:
      - ./backend:/app

    ports:
      - "127.0.0.1:8020:8000"

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: "config.settings"
      APP_URL_PREFIX: ${APP_URL_PREFIX:-}
      OLLAMA_BASE_URL: http://ollama:11434

    depends_on:
      ollama:
        condition: service_healthy

    restart: unless-stopped


  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    volumes:
      - ollama_data:/root/.ollama

    expose:
      - "11434"

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: schema_catalog-frontend:dev
    container_name: react_frontend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "127.0.0.1:3020:3000"

    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=${REACT_APP_API_URL:?Set REACT_APP_API_URL in .env to the public backend URL}
      - REACT_APP_BASE_PATH=${APP_URL_PREFIX:-}
      - PUBLIC_URL=${APP_URL_PREFIX:-}
      
      - WDS_SOCKET_HOST=lk.guimc.bmstu.ru
      - WDS_SOCKET_PORT=443
      - WDS_SOCKET_PATH=/fablab/ws

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  ollama_data:
